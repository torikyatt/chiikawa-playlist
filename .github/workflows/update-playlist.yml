name: Update Chiikawa Playlist

on:
  schedule:
    # UTC基準(JST = UTC+9)。JSTで 8:10 / 8:20 / 8:30 / 9:00 / 18:00 に相当
    - cron: "10 23 * * *"  # JST 8:10
    - cron: "20 23 * * *"  # JST 8:20
    - cron: "30 23 * * *"  # JST 8:30
    - cron: "0 0 * * *"    # JST 9:00
    - cron: "0 9 * * *"    # JST 18:00
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにする

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest playlist data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python fetch_playlist.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git diff --cached --quiet || git commit -m "Update playlist.json"
          git push
